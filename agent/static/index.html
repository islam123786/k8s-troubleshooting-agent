<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kubernetes Troubleshooting Agent</title>
<style>
  :root {
    --bg: #fbfaf9; --panel: #fff; --ink: #1c1a17; --muted: #6b6560;
    --line: #e7e3de; --accent: #b8563a; --ok: #2f6f4f; --deny: #a33;
    --code-bg: #f4f2ef;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16150f; --panel: #1e1c17; --ink: #eeeae4; --muted: #9c948a;
      --line: #322e27; --accent: #d97757; --ok: #6bbf8f; --deny: #e0736b;
      --code-bg: #26231d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.6 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 12px 20px; border-bottom: 1px solid var(--line);
    background: var(--panel); display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  }
  h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  .meta { font-size: 12.5px; color: var(--muted); font-family: ui-monospace, monospace; }
  .badge {
    font-size: 11px; padding: 2px 8px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted);
  }
  .badge.ro { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--line)); }
  nav { margin-left: auto; display: flex; gap: 6px; }
  nav button {
    font: inherit; font-size: 13px; padding: 4px 11px; border-radius: 7px;
    border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer;
  }
  nav button:hover { color: var(--ink); border-color: var(--muted); }

  main { flex: 1; overflow-y: auto; padding: 22px 20px 8px; }
  .wrap { max-width: 780px; margin: 0 auto; }

  .turn { margin-bottom: 26px; }
  .you {
    font-weight: 600; padding-left: 13px;
    border-left: 3px solid var(--accent); margin-bottom: 16px;
  }
  .answer { white-space: pre-wrap; }
  .answer:empty { display: none; }

  .tool {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px;
    color: var(--muted); background: var(--code-bg); border: 1px solid var(--line);
    border-radius: 7px; padding: 5px 10px; margin: 5px 0; overflow-x: auto; white-space: pre;
  }
  .tool b { color: var(--ink); font-weight: 600; }

  .status { color: var(--muted); font-size: 13px; font-style: italic; }
  .err {
    color: var(--deny); border: 1px solid currentColor; border-radius: 7px;
    padding: 9px 12px; font-size: 13.5px;
  }
  .done { font-size: 12px; color: var(--muted); margin-top: 10px; font-family: ui-monospace, monospace; }

  pre.dump {
    background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 13px; overflow-x: auto; font-size: 12.5px; white-space: pre-wrap;
  }

  footer { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 20px; }
  form { max-width: 780px; margin: 0 auto; display: flex; gap: 9px; }
  input {
    flex: 1; font: inherit; padding: 10px 13px; border-radius: 9px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button.send {
    font: inherit; padding: 10px 20px; border-radius: 9px; border: 0;
    background: var(--accent); color: #fff; font-weight: 600; cursor: pointer;
  }
  button.send:disabled { opacity: .45; cursor: default; }
  .hint { max-width: 780px; margin: 8px auto 0; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>

<header>
  <h1>Kubernetes Troubleshooting Agent</h1>
  <span class="meta" id="ctx">…</span>
  <span class="badge ro" id="mode">read-only</span>
  <nav>
    <button onclick="show('/api/findings','Findings')">Findings</button>
    <button onclick="show('/api/audit','Audit log')">Audit</button>
  </nav>
</header>

<main><div class="wrap" id="feed">
  <p class="status">Ask what is wrong in the cluster. The agent investigates read-only —
  it can explain and propose a fix, but cannot change anything.</p>
</div></main>

<footer>
  <form id="f" onsubmit="ask(event)">
    <input id="q" autocomplete="off" autofocus
           placeholder="What is wrong in the chaos namespace?">
    <button class="send" id="go" type="submit">Ask</button>
  </form>
  <div class="hint">Fixes are written to <code>.agent-memory/proposals/</code> for you to review and apply.</div>
</footer>

<script>
const feed = document.getElementById('feed');
const input = document.getElementById('q');
const go = document.getElementById('go');

fetch('/api/health').then(r => r.json()).then(h => {
  document.getElementById('ctx').textContent = h.context;
  document.getElementById('mode').textContent =
    h.read_only ? 'read-only' : 'writes enabled';
});

function el(cls, text) {
  const d = document.createElement('div');
  d.className = cls;
  if (text !== undefined) d.textContent = text;
  return d;
}

function ask(event) {
  event.preventDefault();
  const question = input.value.trim();
  if (!question) return;
  input.value = '';
  go.disabled = true;

  const turn = el('turn');
  turn.appendChild(el('you', question));
  const status = el('status', 'Investigating…');
  turn.appendChild(status);
  const answer = el('answer');
  turn.appendChild(answer);
  feed.appendChild(turn);
  window.scrollTo(0, document.body.scrollHeight);

  const source = new EventSource('/api/ask?q=' + encodeURIComponent(question));

  source.addEventListener('tool', e => {
    const d = JSON.parse(e.data);
    const line = el('tool');
    line.innerHTML = '<b>' + d.name + '</b>  ';
    line.appendChild(document.createTextNode(d.detail));
    turn.insertBefore(line, answer);
    scrollDown();
  });

  source.addEventListener('text', e => {
    status.remove();
    answer.textContent += JSON.parse(e.data).text;
    scrollDown();
  });

  source.addEventListener('error', e => {
    status.remove();
    let msg = 'Connection to the agent failed.';
    try { msg = JSON.parse(e.data).message; } catch (_) {}
    turn.appendChild(el('err', msg));
    finish(source);
  });

  source.addEventListener('done', e => {
    status.remove();
    const d = JSON.parse(e.data);
    const bits = [];
    if (d.turns) bits.push(d.turns + ' turns');
    if (d.cost_usd) bits.push('$' + Number(d.cost_usd).toFixed(4));
    if (bits.length) turn.appendChild(el('done', bits.join('  ·  ')));
    finish(source);
  });
}

function finish(source) {
  source.close();
  go.disabled = false;
  input.focus();
  scrollDown();
}

function scrollDown() {
  const m = document.querySelector('main');
  m.scrollTop = m.scrollHeight;
}

async function show(url, title) {
  const data = await (await fetch(url)).json();
  const body = data.text !== undefined
    ? data.text
    : data.entries.map(e =>
        [e.ts, e.event === 'attempt' ? e.verdict : e.status, e.tool_name || '',
         e.reason || ''].filter(Boolean).join('  ')).join('\n');
  const turn = el('turn');
  turn.appendChild(el('you', title));
  const pre = document.createElement('pre');
  pre.className = 'dump';
  pre.textContent = body.trim() || '(nothing yet)';
  turn.appendChild(pre);
  feed.appendChild(turn);
  scrollDown();
}
</script>
</body>
</html>
