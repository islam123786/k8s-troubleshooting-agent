apiVersion: apps/v1
kind: Deployment
metadata: { name: crashloop-app, namespace: chaos }
spec:
  replicas: 1
  selector: { matchLabels: { app: crashloop-app } }
  template:
    metadata: { labels: { app: crashloop-app } }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          # Exits 1 immediately. Deployment restartPolicy is Always, so this
          # becomes CrashLoopBackOff with a climbing restart count.
          command: ["sh", "-c", "echo 'FATAL: config file /etc/app/config.yaml not found'; exit 1"]
