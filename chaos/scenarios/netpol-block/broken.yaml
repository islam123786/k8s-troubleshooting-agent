apiVersion: apps/v1
kind: Deployment
metadata: { name: guarded, namespace: chaos }
spec:
  replicas: 1
  selector: { matchLabels: { app: guarded } }
  template:
    metadata: { labels: { app: guarded } }
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata: { name: guarded-svc, namespace: chaos }
spec:
  selector: { app: guarded }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-ingress, namespace: chaos }
spec:
  podSelector: { matchLabels: { app: guarded } }
  policyTypes: [Ingress]
  # No ingress rules at all: everything is dropped, silently. No error appears
  # anywhere; connections simply time out.
  ingress: []
