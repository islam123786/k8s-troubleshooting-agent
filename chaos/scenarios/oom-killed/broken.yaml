apiVersion: apps/v1
kind: Deployment
metadata: { name: oom-app, namespace: chaos }
spec:
  replicas: 1
  selector: { matchLabels: { app: oom-app } }
  template:
    metadata: { labels: { app: oom-app } }
    spec:
      containers:
        - name: app
          image: polinux/stress:latest
          # Allocates 250M against a 128Mi limit: killed within seconds.
          command: ["stress"]
          args: ["--vm", "1", "--vm-bytes", "250M", "--vm-hang", "0"]
          resources:
            requests: { memory: "64Mi", cpu: "50m" }
            limits:   { memory: "128Mi" }
