apiVersion: apps/v1
kind: Deployment
metadata: { name: api, namespace: chaos }
spec:
  replicas: 1
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80 }]      # nginx listens on 80
---
apiVersion: v1
kind: Service
metadata: { name: api-svc, namespace: chaos }
spec:
  selector: { app: api }
  # Endpoints populate correctly, but traffic is forwarded to 8080 where nothing
  # is listening. This is the case that looks fine in `get endpoints`.
  ports: [{ port: 80, targetPort: 8080 }]
