apiVersion: v1
kind: ResourceQuota
metadata: { name: tight-quota, namespace: chaos }
spec:
  hard:
    requests.memory: "64Mi"
    requests.cpu: "100m"
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: quota-app, namespace: chaos }
spec:
  replicas: 3
  selector: { matchLabels: { app: quota-app } }
  template:
    metadata: { labels: { app: quota-app } }
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
          # 3 x 128Mi against a 64Mi quota. The ReplicaSet is rejected, so there
          # are no Pending pods to look at — the evidence is on the ReplicaSet.
          resources:
            requests: { memory: "128Mi", cpu: "100m" }
