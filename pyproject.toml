[project]
name = "k8s-troubleshooting-agent"
version = "0.1.0"
description = "A guardrailed Kubernetes troubleshooting agent built on the Claude Agent SDK"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires a running kind cluster and an ANTHROPIC_API_KEY",
]
# Integration tests are opt-in: they cost money and need Docker.
addopts = "-m 'not integration' --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
# No global subprocess exemption: agent/kubectl.py carries its own inline noqa,
# and tests/test_no_subprocess_bypass.py enforces that it stays the only module
# that spawns anything. A repo-wide ignore would disable the check everywhere.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S108"]  # asserts, fixture creds, and /tmp paths are the point
